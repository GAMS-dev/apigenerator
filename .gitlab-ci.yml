variables:
    CONTAINER_REG:
        value: registry.gams.com/devel
        description: "URL to the container registry"

apigenerate:
    stage: build
    tags: [linux]
    image:
        name: $CONTAINER_REG/gdx/leg/builder-gdx:latest
        entrypoint: [ "" ]
    script:
        - echo "This job generates api files for wrp library on leg"
        - python3 src/mkapi.py --apidef `pwd`/tests/wrptestapi.yaml --outputpath tests/wrptest/
    artifacts:
        name: apiwrptest
        expire_in: 2 hours
        paths: [ tests/wrptest/* ]

test-leg:
    stage: test
    when: on_success
    dependencies: [apigenerate]
    tags: [linux]
    image:
        name: $CONTAINER_REG/machines/leg/builder-full:latest
    script:
        - echo "Preaparing environment for python on leg"
        - yum install -y python312 python3.12-pip python3.12-devel
        - ln -s /usr/bin/python3 /usr/bin/python
        - pip3 install swig==4.4.0
        - echo "Building tests for apigenerated files on leg"
        - export GSYS=leg
        - export GCIA=lex
        - cd tests
        - make
        - echo "This job test apigenerated files on leg"
        - OSTYPE=linux ./apiwrappertest.sh
    artifacts:
        name: wrptest-leg
        expire_in: 2 hours
        paths: [ tests/wrptest/* ]

test-wei:
    stage: test
    when: on_success
    tags: [windows]
    dependencies: [apigenerate]
    image:
        name: $CONTAINER_REG/machines/wei/builder-full:latest
    script:
        - echo "Building tests for apigenerated files on wei"
        - conda create -y -n wrptest-env-3.10 python=3.10
        - conda env list
        - conda activate wrptest-env-3.10
        - $env:Path = "C:\Miniconda\envs\wrptest-env-3.10;C:\Miniconda\envs\wrptest-env-3.10\Scripts;" + $env:Path
        - python --version
        - which python
        - python -m pip install --force-reinstall -v "swig==4.4.0"
        - which swig
        - cp tests/* tests/wrptest/
        - cp include/gamsglobals.* tests/wrptest/
        - cp include/gclgms.h tests/wrptest/
        - $env:GSYS = "wei"
        - $env:GCIA = "wex"
        - cd tests
        - make
        - cd wrptest
        - vbc.exe /out:testervbnet.exe /platform:x64 testervbnet.vb c_wrpvbnet.vb gamsglobals.vb
        - Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile ./dotnet-install.ps1
        - ./dotnet-install.ps1 -Channel 10.0 -InstallDir 'C:\Program Files\dotnet'
        - dotnet --list-sdks
        - $env:DOTNET_CLI_TELEMETRY_OPTOUT=1
        - dotnet new console -o wrpcstest
        - rm wrpcstest/*.cs
        - cp *.cs wrpcstest/
        - cp *wrp*.dll wrpcstest/
        - cd wrpcstest
        - dotnet build --output ./build -p:Nullable=disable
        - echo "This job test apigenerated files on wei"
        - $env:Path = "C:\builds\devel\apigenerator\tests\wrptest;" + $env:Path
        - $env:OSTYPE = "windows"
        - cd ../..
        - sh apiwrappertest.sh
    artifacts:
        name: wrptest-wei
        expire_in: 2 hours
        paths: [ tests/wrptest/* ]

test-deg:
    stage: test
    when: on_success
    dependencies: [apigenerate]
    tags: [macos]
    script:
        - echo "Preaparing environment for python on deg"
        - eval "$($MINICONDA shell.bash hook)"
        - conda create -y -n wrptest-env-3.10 python=3.10
        - conda activate wrptest-env-3.10
        - conda install -y -c conda-forge swig=4.4.0
        - echo "Building tests for apigenerated files on deg"
        - export GSYS=deg
        - export GCIA=dex
        - cd tests
        - make
        - echo "This job test apigenerated files on deg"
        - OSTYPE=macos ./apiwrappertest.sh
    artifacts:
        name: wrptest-deg
        expire_in: 2 hours
        paths: [ tests/wrptest/* ]

test-dac:
    stage: test
    when: on_success
    dependencies: [apigenerate]
    tags: [macos-arm64]
    script:
        - echo "Preaparing environment for python on dac"
        - eval "$($MINICONDA shell.bash hook)"
        - conda create -y -n wrptest-env-3.10 python=3.10
        - conda activate wrptest-env-3.10
        - conda install -y -c conda-forge swig=4.4.0
        - echo "Building tests for apigenerated files on dac"
        - export GSYS=dac
        - export GCIA=dax
        - cd tests
        - make
        - echo "This job test apigenerated files on dac"
        - OSTYPE=macos ./apiwrappertest.sh
    artifacts:
        name: wrptest-dac
        expire_in: 2 hours
        paths: [ tests/wrptest/* ]
